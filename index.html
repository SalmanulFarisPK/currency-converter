<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Font Awesome CDN(for icons) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h2>Currency Converter</h2>
      <form>
        <div class="amount">
          <p id="p-from">Enter Amount</p>
          <input value="0" type="text" />
        </div>
        <!-- From section -->
        <div class="dropdown">
          <div class="from">
            <p id="p-from">From</p>
            <div class="select-container">
              <img src="https://flagsapi.com/US/shiny/64.png" />
              <select name="from" id="from-select"></select>
            </div>
          </div>
          <i class="fa-solid fa-arrow-right-arrow-left" id="arrow"></i>
          <!-- To section -->
          <div class="to">
            <p id="p-to">To</p>
            <div class="select-container">
              <img src="https://flagsapi.com/IN/shiny/64.png" />
              <select name="to" id="to-select"></select>
            </div>
          </div>
        </div>
        <!-- Result section -->
        <div class="msg">1 USD = 83.50 INR</div>
        <button id="btn">Convert</button>
      </form>
    </div>
    <script src="countryList.js"></script>
    <script src="script.js"></script>
  </body>
</html>
